<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">TradeSystem project banner</title>
  <desc id="desc">Illustrative project graphic for a PocketMine-MP item trading plugin, not an in-game screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b39"/>
      <stop offset="1" stop-color="#30305e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#292e57"/>
      <stop offset="1" stop-color="#1b2343"/>
