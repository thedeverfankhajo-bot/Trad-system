name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Check PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run domain and project smoke tests
        run: php tests/run.php

      - name: Parse plugin manifest and YAML resources
        run: |
          ruby -e 'require "yaml"; ARGV.each { |p| YAML.load_file(p, aliases: true); puts "Valid YAML: #{p}" }' plugin.yml resources/config.yml resources/messages.yml
