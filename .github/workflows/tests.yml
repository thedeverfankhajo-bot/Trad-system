name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: validate (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Check PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run domain and project smoke tests
        run: php tests/run.php

      - name: Validate plugin manifest and YAML resources
        run: |
          ruby -e '
            require "yaml"
            manifest = YAML.load_file("plugin.yml", aliases: true)
            abort "plugin.yml must be a mapping" unless manifest.is_a?(Hash)
            abort "Unexpected plugin name" unless manifest["name"] == "TradeSystem"
            abort "Unexpected Main class" unless manifest["main"] == ["TradSystem", "Main"].join(92.chr)
            abort "PocketMine-MP API 5 is required" unless Array(manifest["api"]).map(&:to_s).include?("5.0.0")
            permission = "tradesystem.command.trade"
            abort "The trade command must declare its permission" unless manifest.dig("commands", "trade", "permission") == permission
            permission_data = manifest.dig("permissions", permission)
            abort "The trade permission must default to true" unless permission_data.is_a?(Hash) && permission_data["default"] == true
            harness = YAML.load_file("tests/integration/plugin.yml", aliases: true)
            abort "Integration harness manifest must be a mapping" unless harness.is_a?(Hash)
            abort "Unexpected integration harness Main class" unless harness["main"] == "TradeSystemIntegrationHarness\\Main"
            abort "Integration harness must depend on TradeSystem" unless Array(harness["depend"]).include?("TradeSystem")
            harness_permission = "tradesystem.integration.run"
            abort "Integration harness command must declare its permission" unless harness.dig("commands", "tradeint", "permission") == harness_permission
            harness_permission_data = harness.dig("permissions", harness_permission)
            abort "Integration harness permission must default to op" unless harness_permission_data.is_a?(Hash) && harness_permission_data["default"] == "op"
            ARGV.each do |path|
              YAML.load_file(path, aliases: true)
              puts "Valid YAML: #{path}"
            end
          ' resources/config.yml resources/messages.yml

  package-phar:
    name: Build TradeSystem PHAR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Validate source and metadata
        run: |
          composer validate --no-check-publish
          find src -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/run.php

      - name: Build PHAR
        run: php -d phar.readonly=0 tools/build-phar.php

      - name: Verify archive and print checksum
        run: |
          php -r '$p = new Phar("build/TradeSystem.phar"); foreach (["plugin.yml", "src/TradSystem/Main.php", "resources/config.yml", "resources/messages.yml"] as $f) { if (!$p->offsetExists($f)) { fwrite(STDERR, "Missing archive entry: $f\\n"); exit(1); } } echo "Archive entries verified.\\n";'
          sha256sum build/TradeSystem.phar > build/TradeSystem.phar.sha256
          sha256sum --check build/TradeSystem.phar.sha256

      - name: Upload distributable PHAR and checksum
        uses: actions/upload-artifact@v4
        with:
          name: TradeSystem-PHAR
          path: |
            build/TradeSystem.phar
            build/TradeSystem.phar.sha256
          if-no-files-found: error
          retention-days: 30

  phpstan:
    name: PHPStan (PocketMine-MP API 5)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PocketMine-compatible PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: "8.3"
          install-path: "./bin"
          pm-version-major: 5

      - name: Resolve API-aware analysis dependencies
        working-directory: ./phpstan
        run: composer update --prefer-dist --no-interaction

      - name: Analyze source with PHPStan
        working-directory: ./phpstan
        run: vendor/bin/phpstan analyse --no-progress
