name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: validate (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Check PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run domain and project smoke tests
        run: php tests/run.php

      - name: Validate plugin manifest and YAML resources
        run: |
          ruby -e '
            require "yaml"
            manifest = YAML.load_file("plugin.yml", aliases: true)
            abort "plugin.yml must be a mapping" unless manifest.is_a?(Hash)
            abort "Unexpected plugin name" unless manifest["name"] == "TradeSystem"
            abort "Unexpected Main class" unless manifest["main"] == ["TradSystem", "Main"].join(92.chr)
            abort "PocketMine-MP API 5 is required" unless Array(manifest["api"]).map(&:to_s).include?("5.0.0")
            permission = "tradesystem.command.trade"
            abort "The trade command must declare its permission" unless manifest.dig("commands", "trade", "permission") == permission
            permission_data = manifest.dig("permissions", permission)
            abort "The trade permission must default to true" unless permission_data.is_a?(Hash) && permission_data["default"] == true
            ARGV.each do |path|
              YAML.load_file(path, aliases: true)
              puts "Valid YAML: #{path}"
            end
          ' resources/config.yml resources/messages.yml
