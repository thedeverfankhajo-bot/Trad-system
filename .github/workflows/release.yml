name: Publish PHAR release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-phar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Verify tag matches plugin version
        run: |
          set -euo pipefail
          VERSION="$(ruby -e 'require "yaml"; puts YAML.load_file("plugin.yml")["version"]')"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME must match plugin version v$VERSION." >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Check PHP syntax and run tests
        run: |
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/run.php

      - name: Validate YAML
        run: ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file, aliases: true); puts "Valid YAML: #{file}" }' plugin.yml resources/config.yml resources/messages.yml

      - name: Build PHAR
        run: php -d phar.readonly=0 tools/build-phar.php

      - name: Verify archive and generate checksum
        run: |
          php -r '$p = new Phar("build/TradeSystem.phar"); foreach (["plugin.yml", "src/TradSystem/Main.php", "resources/config.yml", "resources/messages.yml"] as $f) { if (!$p->offsetExists($f)) { fwrite(STDERR, "Missing archive entry: $f\\n"); exit(1); } } echo "Archive entries verified.\\n";'
          (cd build && sha256sum TradeSystem.phar > TradeSystem.phar.sha256)

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/TradeSystem.phar build/TradeSystem.phar.sha256 --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --target "$GITHUB_SHA"
